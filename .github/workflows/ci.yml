# .github/workflows/ci.yml
#
# Phase 4, Day 6 — this project's first GitHub Actions workflow. Runs the
# exact three checks this project has run by hand before every commit
# since Phase 1: typecheck, lint, test. The point (plan Section 2.10):
# "it catches the thing that works locally because of a file you forgot
# to commit" — a fresh checkout, a fresh `npm ci`, no leftover local state
# to accidentally rely on.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to match this project's actual development environment
          # (confirmed via `node -v` before writing this file), not just
          # "whatever LTS happens to be current" — a version mismatch is
          # exactly the kind of thing that "works on my machine" hides.
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
